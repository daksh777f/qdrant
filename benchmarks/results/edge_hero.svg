<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d">
<title id='t'>Bandwidth saved without losing events: place-aware vs vector-only dedupe</title>
<desc id='d'>Two stacked panels over the same dedupe-similarity axis. Top: bytes sent as a percent of sending everything. Bottom: percent of real-world events still retrievable from the cloud copy.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--ref:#8a8985}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#333331;--s1:#3987e5;--s2:#d95926;--ref:#8a8985}}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink2);font-size:12px}
.h{fill:var(--ink);font-size:14px;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="760" height="600" fill="var(--surface)"/>
<text class="h" x="64" y="24">Place-aware dedupe keeps the events that place-blind dedupe loses</text>
<line x1="64" y1="52" x2="82" y2="52" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/>
<circle cx="73" cy="52" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text x="90" y="56">LOCI place-aware dedupe</text>
