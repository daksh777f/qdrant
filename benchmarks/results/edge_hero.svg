<circle cx="630.0" cy="369.0" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>LOCI place-aware, threshold 0.7: 90% events retrievable</title></circle>
<path class="ln" d="M64.0 352.0 L144.9 356.2 L225.7 373.2 L306.6 386.0 L387.4 386.0 L468.3 390.2 L549.1 428.5 L630.0 428.5" stroke="var(--s2)"/>
