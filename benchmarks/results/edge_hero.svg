<circle cx="387.4" cy="270.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>vector-only dedupe, threshold 0.9: 7% bytes sent</title></circle>
<circle cx="468.3" cy="270.8" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>vector-only dedupe, threshold 0.85: 7% bytes sent</title></circle>
<circle cx="549.1" cy="274.0" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>vector-only dedupe, threshold 0.8: 5% bytes sent</title></circle>
<circle cx="630.0" cy="274.0" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>vector-only dedupe, threshold 0.7: 5% bytes sent</title></circle>
<line class="grid" x1="64" y1="522.0" x2="630" y2="522.0"/>
<text x="56" y="526.0" text-anchor="end">0</text>
<line class="grid" x1="64" y1="479.5" x2="630" y2="479.5"/>
<text x="56" y="483.5" text-anchor="end">25</text>
<line class="grid" x1="64" y1="437.0" x2="630" y2="437.0"/>
