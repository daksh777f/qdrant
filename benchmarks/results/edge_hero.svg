<line class="grid" x1="225.7" y1="112" x2="225.7" y2="282" style="stroke:var(--ref)"/>
<text x="638" y="116.0">send everything</text>
<path class="ln" d="M64.0 112.0 L144.9 158.5 L225.7 256.9 L306.6 261.2 L387.4 261.2 L468.3 262.3 L549.1 263.4 L630.0 263.4" stroke="var(--s1)"/>
